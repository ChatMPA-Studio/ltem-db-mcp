# NOTA: mismo patrón que chat-mpa/.github/workflows/workflow-chatmpa-skills.yml,
# adaptado a este repo (un solo servicio, Dockerfile en la raíz).
# Nombres fijados por Terraform (chatmpa-migration/Infra-new30june,
# modules/ecs_mcp_service + service.mcp-ltem.json): servicio, family del task
# definition y nombre del contenedor son todos "mcp-ltem", y la imagen se
# busca en dev-app-repo con tag "mcp-ltem".
# El paso "Describe existing task definition" asume que YA existe un task
# definition activo con esa family y un servicio ECS del mismo nombre en
# dev-ecs-cluster (lo crea Terraform con desired_count: 0 hasta que este
# workflow sube la primera imagen).
# El trigger apunta a la rama de pruebas ci/ecs-deploy-dev; cuando el deploy
# esté validado se cambia a main.
name: Deploy mcp-ltem to Amazon ECS (Dev)

on:
  push:
    branches:
      - ci/ecs-deploy-dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: dev-app-repo
  ECS_CLUSTER: dev-ecs-cluster
  SERVICE_NAME: mcp-ltem

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::904596399105:role/github_role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.SERVICE_NAME }}
        run: |
          echo "Build image"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      ###
      ### Register new task definition in cluster
      #
      - name: Describe existing task definition and save JSON
        id: describe-existing-taskdef
        run: |
          # Pasando solo la family, ECS devuelve la última revisión ACTIVE.
          aws ecs describe-task-definition --task-definition "$SERVICE_NAME" --query 'taskDefinition' --output json > .github/ecs-task-definition.json
          echo "task_definition_arn=$(jq -r '.taskDefinitionArn' .github/ecs-task-definition.json)" >> $GITHUB_OUTPUT
          echo "Saved ECS task definition to ecs-task-definition.json"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs-task-definition.json
          container-name: ${{ env.SERVICE_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
